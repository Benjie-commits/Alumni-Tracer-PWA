# SUN-ATES on one Linux host (spec section 10): Nginx + PHP-FPM + MySQL, TLS from Let's Encrypt.
# Assumes the code is at /var/www/sunates and the PWA was built into /var/www/sunates/pwa/dist.
# Replace alumni.example.ac.ug with the domain the Directorate of ICT allocates.
#
# Laravel serves:  /api  /admin  /livewire  /verify  /u  /up  and its public assets (/css, /favicon.ico)
# The PWA serves:  everything else (its index.html handles /, /s/<token>, /reset-password, ...)

server {
    listen 80;
    listen [::]:80;
    server_name alumni.example.ac.ug;

    # certbot's HTTP challenge, then everything to HTTPS (spec section 9: HTTPS throughout).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alumni.example.ac.ug;

    ssl_certificate     /etc/letsencrypt/live/alumni.example.ac.ug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alumni.example.ac.ug/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Spreadsheet imports are capped at 10 MB in the console; allow a little headroom.
    client_max_body_size 12m;

    # Laravel adds X-Content-Type-Options, X-Frame-Options, Referrer-Policy, Permissions-Policy and HSTS
    # (app/Http/Middleware/SecurityHeaders.php); the PWA's static files get the same here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/sunates/pwa/dist;
    index index.html;

    # ---- Laravel ----------------------------------------------------------------------------
    location ~ ^/(api|admin|livewire|verify|u|up)(/|$) {
        root /var/www/sunates/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/(css/|favicon\.ico|robots\.txt) {
        root /var/www/sunates/backend/public;
        try_files $uri =404;
    }

    location = /index.php {
        root /var/www/sunates/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles (.env, .git) from either root.
    location ~ /\. { deny all; }

    # ---- Alumni PWA -------------------------------------------------------------------------
    # The service worker and manifest must not be cached for long, or updates never reach phones.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Hashed build assets can be cached for a year.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    location / { try_files $uri $uri/ /index.html; }
}
