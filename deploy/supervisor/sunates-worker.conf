; Keeps the Laravel queue worker alive (spec section 5.3: queue workers). Surveys, reminders, nudges,
; registration codes sent later and ERP syncs started from the console all run on this worker.
; Install: copy to /etc/supervisor/conf.d/, then `supervisorctl reread && supervisorctl update`.
; After each deployment: `php artisan queue:restart` so the worker picks up new code.

[program:sunates-worker]
command=php /var/www/sunates/backend/artisan queue:work --sleep=3 --max-time=3600
directory=/var/www/sunates/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/sunates-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
